<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Prisma Cursos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/quiz.css">
</head>
<body>

<main class="quiz-modal" id="quiz-modal">
    <a href="quem_somos.html" class="quiz-fechar" aria-label="Voltar para Quem Somos">✕</a>

    <!-- Tela 1: escolher carta -->
    <section class="quiz-tela" id="quiz-tela-cartas">
        <h1 class="quiz-titulo">Escolha uma carta</h1>
        <div class="quiz-linha"></div>
        <div class="quiz-cartas">
            <button type="button" class="quiz-carta" data-pergunta="0" aria-label="Carta 1">
                <img src="../imagens/logo-prisma-cursos.png" alt="">
                <span class="quiz-interrogacao">?</span>
            </button>
            <button type="button" class="quiz-carta" data-pergunta="1" aria-label="Carta 2">
                <img src="../imagens/logo-prisma-cursos.png" alt="">
                <span class="quiz-interrogacao">?</span>
            </button>
            <button type="button" class="quiz-carta" data-pergunta="2" aria-label="Carta 3">
                <img src="../imagens/logo-prisma-cursos.png" alt="">
                <span class="quiz-interrogacao">?</span>
            </button>
        </div>
    </section>

    <section class="quiz-tela quiz-escondido" id="quiz-tela-pergunta">
        <div class="quiz-carta-pergunta">
            <img src="../imagens/logo-prisma-cursos.png" alt="">
            <p id="quiz-texto-pergunta"></p>
        </div>
        <div class="quiz-alternativas" id="quiz-alternativas"></div>
    </section>

    <!-- Tela 3: acertou -->
    <section class="quiz-tela quiz-escondido" id="quiz-tela-certo">
        <div class="quiz-painel quiz-painel-certo">
            <h2>Parabéns!!<br>você ganhou 15% de desconto em todos os nossos planos!!</h2>
            <div class="quiz-linha"></div>
            <p class="quiz-label-codigo">Seu código de desconto é:<br>Dica: clique para revelar!</p>
            <div class="quiz-codigo-area">
                <button type="button" class="quiz-codigo" id="quiz-codigo" title="Clique para revelar">************</button>
                <svg class="quiz-seta" viewBox="0 0 90 100" aria-hidden="true">
                    <path d="M70 8 C 85 25, 60 55, 22 78 M22 78 L 20 52 M22 78 L 46 80" fill="none" stroke="#1a7fe8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <a href="../../index.html" class="quiz-botao-pequeno">Voltar à página inicial ↗</a>
        </div>
    </section>

    <!-- Tela 4: errou -->
    <section class="quiz-tela quiz-escondido" id="quiz-tela-errado">
        <div class="quiz-painel quiz-painel-errado">
            <h2>Poxa :(<br>Infelizmente você errou...</h2>
            <p class="quiz-texto-erro">Porém não fique triste, temos ótimas ofertas em nosso catálogo de cursos!</p>
            <a href="cursos.html" class="quiz-botao-claro">Veja!</a>
        </div>
    </section>
</main>

<script src="../js/quiz.js"></script>
</body>
</html>
